name: Deploy

on:
  push:
    branches: [main]

env:
  SG_ID: sg-0adc30cb5051eec9b

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build
        env:
          VITE_WS_SERVER_URL: ws://${{ secrets.EC2_HOST }}/ws

      - name: Get runner IP
        id: ip
        run: echo "addr=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH to runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 400 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload client build
        run: |
          rsync -avz --delete \
            --exclude='rl_model_weights.json' \
            -e "ssh -i ~/.ssh/key.pem" \
            dist/ ubuntu@${{ secrets.EC2_HOST }}:/var/www/lunarwars/

      - name: Upload server files
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/key.pem" \
            server/package.json server/server.ts \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/lunarwars/server/

      - name: Upload deploy configs
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/key.pem" \
            deploy/Caddyfile ubuntu@${{ secrets.EC2_HOST }}:/tmp/Caddyfile
          rsync -avz \
            -e "ssh -i ~/.ssh/key.pem" \
            deploy/ecosystem.config.cjs ubuntu@${{ secrets.EC2_HOST }}:/opt/lunarwars/

      - name: Install deps and restart
        run: |
          ssh -i ~/.ssh/key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "cd /opt/lunarwars/server && npm install --production=false && cd /opt/lunarwars && pm2 startOrRestart ecosystem.config.cjs && pm2 save && sudo cp /tmp/Caddyfile /etc/caddy/Caddyfile && sudo systemctl reload caddy"

      - name: Revoke runner SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.addr }}/32
